name: SUNORA Channel Partner Build

on:
  push:
    branches:
      - main
      - feature/profit-payout-ui
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sunora-Channel-Partner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and regression tests
        run: npm test
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Google Sheets Edge Function
        run: deno check supabase/functions/sheets-sync/index.ts
      - name: Production build
        run: npm run build
